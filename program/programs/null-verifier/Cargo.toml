[package]
name = "null-verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "null_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32", features = ["init-if-needed"] }
groth16-solana = "0.2"
solana-keccak-hasher = "2"
